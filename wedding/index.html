<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>결혼식 식순</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Noto+Serif+KR:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f6f1e9;
      --paper: #fbf8f3;
      --ink: #3a332d;
      --muted: #8a7f73;
      --gold: #a98a5a;
      --line: #dccfbb;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: "Noto Serif KR", serif;
      font-weight: 300;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 480px; margin: 0 auto; background: var(--paper); min-height: 100vh; }

    header { text-align: center; padding: 72px 24px 48px; }
    .eyebrow { font-family: "Cormorant Garamond", serif; font-style: italic; letter-spacing: .3em; color: var(--gold); font-size: 15px; text-transform: uppercase; }
    h1 { font-weight: 400; font-size: 26px; letter-spacing: .12em; margin: 22px 0 6px; }
    h1 .amp { font-family: "Cormorant Garamond", serif; font-style: italic; color: var(--gold); margin: 0 .35em; }
    .meta { font-size: 13px; color: var(--muted); letter-spacing: .05em; }
    .orn { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 32px auto 0; color: var(--gold); width: 160px; }
    .orn::before, .orn::after { content: ""; flex: 1; height: 1px; background: var(--line); }
    .orn i { width: 6px; height: 6px; border: 1px solid var(--gold); transform: rotate(45deg); }

    h2 { text-align: center; font-family: "Cormorant Garamond", serif; font-weight: 500; letter-spacing: .35em; font-size: 18px; color: var(--gold); margin-bottom: 36px; }

    ol { list-style: none; padding: 0 40px 56px; position: relative; }
    li { display: grid; grid-template-columns: 20px 1fr; column-gap: 16px; padding-bottom: 30px; position: relative; opacity: 0; transform: translateY(10px); transition: opacity .6s, transform .6s; }
    li.in { opacity: 1; transform: none; }
    li::before { content: ""; position: absolute; left: 10px; top: 12px; bottom: -12px; width: 1px; background: var(--line); }
    li:last-child::before { display: none; }
    .dot { width: 9px; height: 9px; border: 1px solid var(--gold); background: var(--paper); transform: rotate(45deg); margin: 9px 0 0 6px; position: relative; z-index: 1; }
    .title { font-size: 17px; font-weight: 600; letter-spacing: .02em; }
    .person { font-size: 13px; color: var(--gold); margin-top: 2px; }
    .note { font-size: 12px; color: var(--muted); margin-top: 6px; padding-left: 10px; border-left: 2px solid var(--line); }

    .verse { margin-top: 14px; padding: 16px 18px; background: #f1eadd; border-radius: 4px; }
    .verse .ref { font-size: 12px; color: var(--gold); margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid var(--line); letter-spacing: .05em; }
    .verse p { display: flex; align-items: baseline; font-size: 14px; line-height: 1.85; word-break: keep-all; margin-top: 6px; }
    .verse .n { flex: 0 0 1.2em; margin-right: .70em; text-align: right; color: var(--gold); font-family: "Cormorant Garamond", serif; font-size: 15px; font-weight: 500; position: relative; top: -2.5px;}

    footer { text-align: center; padding: 8px 24px 72px; font-size: 13px; color: var(--muted); }
    footer .orn { margin: 0 auto 24px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <p class="eyebrow">Wedding Program</p>
      <h1><span id="groom"></span><span class="amp">&amp;</span><span id="bride"></span></h1>
      <p class="meta" id="date"></p>
      <p class="meta" id="place"></p>
      <div class="orn"><i></i></div>
    </header>

    <h2>ORDER</h2>
    <ol id="program"></ol>

    <footer>
      <div class="orn"><i></i></div>
      <p id="greeting"></p>
    </footer>
  </div>

  <script src="program.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    $("groom").textContent = WEDDING.groom;
    $("bride").textContent = WEDDING.bride;
    $("date").textContent = WEDDING.date;
    $("place").textContent = WEDDING.place;
    $("greeting").textContent = WEDDING.greeting;

    const list = $("program");
    PROGRAM.forEach((p) => {
      const li = document.createElement("li");
      const row = (cls, text) => {
        const d = document.createElement("div");
        d.className = cls;
        d.textContent = text;
        return d;
      };
      const body = document.createElement("div");
      body.append(row("title", p.title));
      if (p.person) body.append(row("person", p.person));
      if (p.note) body.append(row("note", p.note));
      if (p.verse) {
        const v = row("verse", "");
        v.append(row("ref", p.verse.ref));
        p.verse.verses.forEach((x) => {
          const line = document.createElement("p");
          const n = document.createElement("span");
          n.className = "n";
          n.textContent = x.n;
          const t = document.createElement("span");
          t.textContent = x.text;
          line.append(n, t);
          v.append(line);
        });
        body.append(v);
      }
      li.append(row("dot", ""), body);
      list.append(li);
    });

    const io = new IntersectionObserver((es) => es.forEach((e) => {
      if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); }
    }), { threshold: 0.2 });
    list.querySelectorAll("li").forEach((li) => io.observe(li));
  </script>
</body>
</html>
