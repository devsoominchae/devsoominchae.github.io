<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>결혼식 식순</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Noto+Serif+KR:wght@300;400;600&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #f6f1e9;
      --paper: #fbf8f3;
      --ink: #3a332d;
      --muted: #8a7f73;
      --gold: #a98a5a;
      --line: #dccfbb;
      --s: 1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: "Noto Serif KR", serif;
      font-weight: 300;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }

    .wrap {
      max-width: 480px;
      margin: 0 auto;
      background: var(--paper);
      min-height: 100vh;
    }

    header {
      text-align: center;
      padding: 72px 24px 48px;
    }

    .eyebrow {
      font-family: "Cormorant Garamond", serif;
      font-style: italic;
      letter-spacing: .3em;
      color: var(--gold);
      font-size: calc(15px * var(--s));
      text-transform: uppercase;
    }

    h1 {
      font-weight: 400;
      font-size: calc(26px * var(--s));
      letter-spacing: .12em;
      margin: 22px 0 6px;
    }

    h1 .amp {
      font-family: "Cormorant Garamond", serif;
      font-style: italic;
      color: var(--gold);
      margin: 0 .35em;
    }

    .meta {
      font-size: calc(13px * var(--s));
      color: var(--muted);
      letter-spacing: .05em;
    }

    .orn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: 32px auto 0;
      color: var(--gold);
      width: 160px;
    }

    .orn::before,
    .orn::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--line);
    }

    .orn i {
      width: 6px;
      height: 6px;
      border: 1px solid var(--gold);
      transform: rotate(45deg);
    }

    h2 {
      text-align: center;
      font-family: "Cormorant Garamond", serif;
      font-weight: 500;
      letter-spacing: .35em;
      font-size: calc(18px * var(--s));
      color: var(--gold);
      margin-bottom: 36px;
    }

    ol {
      list-style: none;
      padding: 0 40px 56px;
      position: relative;
    }

    li {
      display: grid;
      grid-template-columns: 20px 1fr;
      column-gap: 16px;
      padding-bottom: 30px;
      position: relative;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity .6s, transform .6s;
    }

    li.in {
      opacity: 1;
      transform: none;
    }

    li::before {
      content: "";
      position: absolute;
      left: 10px;
      top: 12px;
      bottom: -12px;
      width: 1px;
      background: var(--line);
    }

    li:last-child::before {
      display: none;
    }

    .dot {
      width: 9px;
      height: 9px;
      border: 1px solid var(--gold);
      background: var(--paper);
      transform: rotate(45deg);
      margin: 9px 0 0 6px;
      position: relative;
      z-index: 1;
    }

    .title {
      font-size: calc(17px * var(--s));
      font-weight: 600;
      letter-spacing: .02em;
    }

    .person {
      font-size: calc(13px * var(--s));
      color: var(--gold);
      margin-top: 2px;
    }

    .note {
      font-size: calc(12px * var(--s));
      color: var(--muted);
      margin-top: 6px;
      padding-left: 10px;
      border-left: 2px solid var(--line);
    }

    .verse {
      margin-top: 14px;
      padding: 16px 18px;
      background: #f1eadd;
      border-radius: 4px;
    }

    .verse .ref {
      font-size: calc(12px * var(--s));
      color: var(--gold);
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--line);
      letter-spacing: .05em;
    }

    .verse p {
      display: flex;
      align-items: baseline;
      font-size: calc(14px * var(--s));
      line-height: 1.85;
      word-break: keep-all;
      margin-top: 6px;
    }

    .verse .n {
      flex: 0 0 1.2em;
      margin-right: .70em;
      text-align: right;
      color: var(--gold);
      font-family: "Cormorant Garamond", serif;
      font-size: calc(15px * var(--s));
      font-weight: 500;
      position: relative;
      top: -2.5px;
    }

    .lang {
      position: fixed;
      top: 14px;
      right: max(14px, calc(50% - 226px));
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      background: rgba(251, 248, 243, .92);
      border: 1px solid var(--line);
      border-radius: 999px;
      font-family: "Cormorant Garamond", serif;
      font-weight: 500;
      font-size: 14px;
      letter-spacing: .15em;
      backdrop-filter: blur(4px);
    }

    .size {
      left: max(14px, calc(50% - 226px));
      right: auto;
    }

    .size button {
      line-height: 1;
    }

    .size button:disabled {
      opacity: .3;
      cursor: default;
    }

    .size button[data-d="-1"] {
      font-size: 13px;
    }

    .size button[data-d="1"] {
      font-size: 21px;
    }

    .lang button {
      background: none;
      border: 0;
      cursor: pointer;
      font: inherit;
      letter-spacing: inherit;
      color: var(--muted);
      padding: 0;
    }

    .lang button.on {
      color: var(--gold);
      font-weight: 600;
      border-bottom: 1px solid var(--gold);
    }

    .lang span {
      color: var(--line);
    }

    html[lang="en"] body {
      font-family: "Cormorant Garamond", "Noto Serif KR", serif;
      font-weight: 500;
    }

    html[lang="en"] .title {
      font-size: calc(19px * var(--s));
    }

    html[lang="en"] .person,
    html[lang="en"] .meta,
    html[lang="en"] .note,
    html[lang="en"] footer {
      font-size: calc(15px * var(--s));
    }

    html[lang="en"] .verse p {
      font-size: calc(16px * var(--s));
      word-break: normal;
    }

    footer {
      text-align: center;
      padding: 8px 24px 72px;
      font-size: calc(13px * var(--s));
      color: var(--muted);
    }

    footer .orn {
      margin: 0 auto 24px;
    }
  </style>
</head>

<body>
  <div class="lang" role="group" aria-label="Language">
    <button type="button" data-lang="ko">KOR</button><span>|</span><button type="button" data-lang="en">ENG</button>
  </div>
  <div class="lang size" role="group" aria-label="Font size">
    <button type="button" data-d="-1" aria-label="Smaller text"></button><span>|</span><button type="button" data-d="1" aria-label="Larger text"></button>
  </div>
  <div class="wrap">
    <header>
      <p class="eyebrow">Wedding Program</p>
      <h1><span id="groom"></span><span class="amp">&amp;</span><span id="bride"></span></h1>
      <p class="meta" id="date"></p>
      <p class="meta" id="place"></p>
      <div class="orn"><i></i></div>
    </header>

    <h2>ORDER</h2>
    <ol id="program"></ol>

    <footer>
      <div class="orn"><i></i></div>
      <p id="greeting"></p>
    </footer>
  </div>

  <script src="program.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const list = $("program");
    const TITLES = { ko: "결혼식 식순", en: "Wedding Program" };

    function render(lang) {
      const en = lang === "en";
      // 영어 번역이 없는 항목은 한국어로 대체
      const tr = (obj) => (en && obj.en ? { ...obj, ...obj.en } : obj);

      document.documentElement.lang = lang;
      document.title = TITLES[lang];
      document.querySelectorAll("[data-lang]").forEach((b) => b.classList.toggle("on", b.dataset.lang === lang));
      document.querySelectorAll(".size button").forEach((b) => { b.textContent = en ? "A" : "가"; });

      const w = tr(WEDDING);
      $("groom").textContent = w.groom;
      $("bride").textContent = w.bride;
      $("date").textContent = w.date;
      $("place").textContent = w.place;
      $("greeting").textContent = w.greeting;

      list.replaceChildren();
      PROGRAM.forEach((item) => addItem(tr(item)));
      list.querySelectorAll("li").forEach((li) => io.observe(li));
    }

    function addItem(p) {
      const li = document.createElement("li");
      const row = (cls, text) => {
        const d = document.createElement("div");
        d.className = cls;
        d.textContent = text;
        return d;
      };
      const body = document.createElement("div");
      body.append(row("title", p.title));
      if (p.person) body.append(row("person", p.person));
      if (p.note) body.append(row("note", p.note));
      if (p.verse) {
        const v = row("verse", "");
        v.append(row("ref", p.verse.ref));
        p.verse.verses.forEach((x) => {
          const line = document.createElement("p");
          const n = document.createElement("span");
          n.className = "n";
          n.textContent = x.n;
          const t = document.createElement("span");
          t.textContent = x.text;
          line.append(n, t);
          v.append(line);
        });
        body.append(v);
      }
      li.append(row("dot", ""), body);
      list.append(li);
    }

    const io = new IntersectionObserver((es) => es.forEach((e) => {
      if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); }
    }), { threshold: 0.2 });

    const saved = (() => { try { return localStorage.getItem("lang"); } catch { return null; } })();
    let current = saved || ((navigator.language || "").toLowerCase().startsWith("ko") ? "ko" : "en");
    // 글자 크기 단계 (모바일에서 레이아웃이 깨지지 않도록 최대 1.2배)
    const SCALES = [0.8, 0.9, 1, 1.1, 1.2, 1.3, 1.4];
    let step = 1;
    try { const v = parseInt(localStorage.getItem("fontStep"), 10); if (v >= 0 && v < SCALES.length) step = v; } catch { }
    function applySize() {
      document.documentElement.style.setProperty("--s", SCALES[step]);
      document.querySelector('.size [data-d="-1"]').disabled = step === 0;
      document.querySelector('.size [data-d="1"]').disabled = step === SCALES.length - 1;
      try { localStorage.setItem("fontStep", step); } catch { }
    }
    document.querySelectorAll(".size button").forEach((b) => b.addEventListener("click", () => {
      step = Math.max(0, Math.min(SCALES.length - 1, step + Number(b.dataset.d)));
      applySize();
    }));
    applySize();

    document.querySelectorAll("[data-lang]").forEach((b) => b.addEventListener("click", () => {
      current = b.dataset.lang;
      try { localStorage.setItem("lang", current); } catch { }
      render(current);
    }));
    render(current);
  </script>
</body>

</html>
