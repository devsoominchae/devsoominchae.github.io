<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>여행 일정</title>
<style>
:root{
  --bg:#f4f6f5; --card:#fff; --ink:#1c2523; --sub:#5d6b67; --line:#dde4e1;
  --accent:#0f766e; --accent-soft:#ddf1ee; --memo:#fff8dc; --memo-line:#ecdca0; --danger:#b42318;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#121816; --card:#1b2421; --ink:#e8efec; --sub:#9aaba5; --line:#2b3733;
    --accent:#4fd1c1; --accent-soft:#183a35; --memo:#2b2812; --memo-line:#4d4619; --danger:#f97066;}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Segoe UI",sans-serif;
  padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:20;background:var(--accent);color:#fff;padding:env(safe-area-inset-top) 0 0}
.bar{margin:0;padding:10px 16px 0;display:flex;align-items:center;gap:8px}
.bar h1{font-size:17px;margin:0;flex:1}
.tabs{margin:0;display:flex;gap:6px;overflow-x:auto;overscroll-behavior-x:contain;padding:8px 16px 6px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.55) transparent}
.tabs::-webkit-scrollbar{height:5px}
.tabs::-webkit-scrollbar-track{background:transparent}
.tabs::-webkit-scrollbar-thumb{background:rgba(255,255,255,.55);border-radius:999px}
.tabs::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.85)}
.tab{flex:none;border:0;border-radius:999px;padding:6px 14px;background:rgba(255,255,255,.18);color:#fff;font:inherit;font-size:14px;cursor:pointer}
.tab.on{background:#fff;color:#0f766e;font-weight:700}
.hbtn{border:0;background:rgba(255,255,255,.18);color:#fff;border-radius:8px;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer}
.hbtn.on{background:#fff;color:#0f766e;font-weight:700}
main{max-width:1100px;margin:0 auto;padding:16px}
h2{font-size:20px;margin:4px 0 12px}
.info{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px 14px;margin-bottom:14px}
.info div{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.info div:last-child{border:0}
.info b{flex:none;width:72px;color:var(--accent)}
.info span{flex:1}
.row{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:12px;margin-bottom:10px;align-items:start}
@media (max-width:760px){.row{grid-template-columns:1fr;gap:6px}}
.side{display:flex;flex-direction:column;gap:8px;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stop{border-left:5px solid var(--accent)}
.stop .t{font-size:13px;color:var(--accent);font-weight:700}
.stop .n{font-size:17px;font-weight:700;margin:2px 0}
.pl{text-decoration:none;margin-left:4px}
.chip{display:inline-block;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:1px 10px;font-size:12.5px;font-weight:600}
.leg{background:transparent;border:1px dashed var(--line);margin-left:14px}
.leg .lt{font-weight:700;font-size:14px;margin-bottom:8px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.leg .lt small{color:var(--sub);font-weight:400}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:7px;font:inherit;color:inherit;cursor:pointer}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt .h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.opt .nm{font-weight:700}
.opt .tm{margin-left:auto;font-weight:700;color:var(--accent);white-space:nowrap}
.opt .rt{font-size:13px;color:var(--sub);margin-top:3px}
.opt .nt{font-size:12.5px;margin-top:3px;color:var(--sub)}
.wxd{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:-2px 0 10px}.wxc{font-size:12.5px;background:var(--card,#fff);border:1px solid var(--line);border-radius:999px;padding:2px 8px;white-space:nowrap}.wxc b{font-weight:600}.wxd .chipbtn{font-size:12px}
.wxs{display:inline-block;font-size:12px;color:var(--sub);margin-left:8px;white-space:nowrap}
.nowb{display:block;width:100%;text-align:left;border:0;border-radius:12px;padding:10px 12px;margin:0 0 10px;background:#dcfce7;color:#14532d;font:inherit;font-size:14.5px;line-height:1.45;cursor:pointer}
.nowb .sub{color:#166534;opacity:.85}.nowb.other{background:var(--accent-soft);color:var(--accent);font-weight:700}
.row.nowc .card{box-shadow:0 0 0 2.5px #22c55e;}.row.nowc .card::before{content:'지금';display:inline-block;background:#22c55e;color:#fff;font-size:11px;font-weight:700;border-radius:6px;padding:0 6px;margin-bottom:4px}
.row.past{opacity:.55}.tdot{color:#22c55e;font-size:10px;vertical-align:1px}
.ttot{background:var(--accent-soft);color:var(--text,inherit);border-radius:10px;padding:8px 12px;margin:-4px 0 10px;font-size:14.5px}.ttot b{color:var(--accent)}
.optw{position:relative}
.chs{margin-top:10px}.chh{font-size:12px;color:var(--sub);margin-bottom:5px}.chn{font-size:13px;color:var(--sub);margin-top:2px}
.whentag{display:inline-block;font-size:11px;font-weight:600;color:var(--sub);border:1px dashed var(--line);border-radius:6px;padding:0 6px;margin-left:6px;vertical-align:1px}
.opt.hasmap{padding-right:78px}
.optmap{position:absolute;right:10px;bottom:16px;font-size:12.5px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:2px 9px;text-decoration:none}
.radio{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);flex:none}
.opt.sel .radio{border-color:var(--accent);background:radial-gradient(var(--accent) 45%,transparent 50%)}
.memo{background:var(--memo);border-color:var(--memo-line);padding:8px}
.memo label{font-size:12px;color:var(--sub);display:block;margin-bottom:2px}
.row>.memo{align-self:stretch}
textarea,input[type=text],input[type=number],select{width:100%;font:inherit;color:inherit;background:transparent;border:0;resize:vertical;outline:none}
.memo textarea{min-height:56px;height:calc(100% - 20px)}
.side .memo textarea{height:auto}
.edit input[type=text],.edit input[type=number],.edit textarea.f,.edit select{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 7px;margin:2px 0}
.edit textarea.f{min-height:44px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:4px 10px;font:inherit;font-size:13px;cursor:pointer;text-decoration:none;display:inline-block}
.btn.del{color:var(--danger)}
.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.check{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 14px;margin-top:20px}
.check h3{margin:8px 0;font-size:16px}
.ck{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.ck input[type=checkbox]{width:20px;height:20px;margin-top:2px;accent-color:var(--accent);flex:none}
.ck.done span{text-decoration:line-through;color:var(--sub)}
.ck span{flex:1}
.src{font-size:12px;color:var(--sub);margin-top:16px}
footer{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:15}
footer div{max-width:1100px;margin:0 auto;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
footer small{color:var(--sub)}
footer b{font-size:17px;color:var(--accent)}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);max-width:440px;width:calc(100% - 32px)}
dialog textarea{border:1px solid var(--line);border-radius:8px;min-height:100px;padding:8px}
dialog input[type=text]{border:1px solid var(--line);border-radius:8px;padding:8px}
/* maps */
.mapwrap{min-width:0}
.mapbox{height:250px;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--bg)}
.mapbox iframe{width:100%;height:100%;border:0}
.mapbox.empty{display:flex;align-items:center;justify-content:center;text-align:center;padding:14px;color:var(--sub);font-size:13px;height:auto;min-height:90px}
.mapcap{font-size:12.5px;color:var(--sub);margin:4px 2px 0}
.mapcap a{color:var(--accent);font-weight:600;text-decoration:none}
.chipbtn{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 12px;font:inherit;font-size:13.5px;cursor:pointer}
.chipbtn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
.chips small{color:var(--sub)}
.pbox{margin:12px 0}
.pbox>*+*{margin-top:8px}
.pbox input[type=text]{border:1px solid var(--line);border-radius:8px;padding:8px}
.pcard{margin-bottom:8px}
.ph{display:flex;gap:10px;align-items:center}
.pin{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;font-size:18px}
.sub{color:var(--sub);font-size:13px}
.pcard textarea{border:1px solid var(--memo-line);background:var(--memo);border-radius:8px;padding:6px 8px;margin-top:8px;min-height:44px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1c2523;color:#fff;padding:9px 16px;border-radius:999px;font-size:14px;z-index:50;max-width:90%}
gmp-place-autocomplete{width:100%}
.pkbar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.pkbar div{height:100%;background:var(--accent);transition:width .25s}
.ck.done input[type=text]{text-decoration:line-through;color:var(--sub)}
.ck input[type=text]{padding:2px 0}
.cardtools{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.lt .btn{margin-left:auto}
.kind{display:inline-block;font-size:11.5px;font-weight:700;border:1px solid;border-radius:999px;padding:0 8px;margin-left:8px;vertical-align:1px}
.chips .btn{margin-left:auto}
/* 전체 요약 */
.sumwrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--card);max-height:calc(100vh - 190px)}
table.sum{border-collapse:separate;border-spacing:0;font-size:12.5px;min-width:max-content}
table.sum th,table.sum td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px 6px;vertical-align:top;min-width:150px;max-width:190px}
table.sum thead th{position:sticky;top:0;z-index:3;background:var(--accent);color:#fff;text-align:center;cursor:pointer}
table.sum thead th.gor{background:#d97706}
table.sum thead tr:nth-child(2) th,table.sum thead tr:nth-child(2) td{position:sticky;top:44px;z-index:3;background:var(--memo);font-size:11.5px;font-weight:400}
table.sum th.hr{position:sticky;left:0;z-index:4;min-width:62px;max-width:62px;background:var(--bg);color:var(--sub);font-size:12px;text-align:center}
table.sum thead th.hr{z-index:5;background:var(--accent)}
table.sum tbody tr{height:46px}
table.sum td.blk{background:var(--accent-soft);cursor:pointer}
table.sum td.blk.fl{background:#dbeafe;color:#1e3a5f}
table.sum td.blk.fd{background:#fde7d6;color:#5b3412}
@media (prefers-color-scheme:dark){table.sum td.blk.fl{background:#1c3350;color:#cfe3ff}table.sum td.blk.fd{background:#4a3320;color:#ffe3cc}}
table.sum td.blk .tm{color:var(--sub);font-size:11px}
table.sum td.blk .lg{color:var(--accent);font-size:11.5px;margin-top:2px}
table.sum td.blk .ex{font-size:11.5px;margin-top:3px;border-top:1px dashed var(--line);padding-top:2px}
table.sum td.stay{cursor:pointer}
table.rt{border-collapse:collapse;width:100%;font-size:13px}
table.rt th{background:var(--accent-soft);color:var(--accent);text-align:left;padding:6px 8px;position:sticky;top:0}
table.rt td{padding:6px 8px;border-top:1px solid var(--line);vertical-align:top}
table.rt small{color:var(--sub)}
table.rt .ar{color:var(--accent);font-weight:700}
table.rt a{color:var(--accent);font-weight:600;text-decoration:none;white-space:nowrap}
#lock{position:fixed;inset:0;z-index:999;background:var(--bg,#f6f7f9);display:flex;align-items:center;justify-content:center;padding:20px}
#lock[hidden]{display:none}
.lockbox{width:100%;max-width:320px;text-align:center}
.lockbox input{width:100%;box-sizing:border-box;font-size:17px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;text-align:center}
body.locked header,body.locked main{visibility:hidden}
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>✈️ 신혼여행 일정</h1>
    <button class="hbtn" id="syncBtn" title="설정 · 동기화">☁️</button>
    <button class="hbtn" id="editBtn">편집</button>
    <button class="hbtn" id="menuBtn">⋯</button>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>
<main id="app"></main>
<div id="lock" hidden><div class="lockbox">
  <div style="font-size:44px">🔒</div>
  <p style="margin:6px 0 14px"><b>우리 여행 일정</b><br><span class="src">비밀번호를 넣어 주세요. 이 기기에서는 다음부터 안 물어봐요.</span></p>
  <input type="password" id="lockpw" placeholder="비밀번호" autocomplete="current-password">
  <button class="btn pri" type="button" id="lockBtn" style="margin-top:10px;width:100%">열기</button>
  <p class="src" id="lockMsg" style="min-height:1.4em"></p>
</div></div>
<footer><div><small id="fl">교통비 합계 (2인)</small><b id="total"></b></div></footer>

<dialog id="dlg">
  <form method="dialog">
    <p style="margin-top:0"><b>☁️ GitHub 동기화</b></p>
    <input type="text" id="tok" placeholder="GitHub 토큰 (없으면 읽기 전용)" autocomplete="off">
    <p class="src" style="margin-top:6px">저장소 devsoominchae.github.io, Contents: Read and write 권한의 fine-grained 토큰. 이 기기 브라우저에만 저장돼요.</p>
    <div class="tools"><button class="btn pri" type="button" id="tokBtn">저장 · 지금 동기화</button></div>
    <hr style="border:0;border-top:1px solid var(--line);margin:14px 0">
    <p><b>🔒 비밀번호 잠금</b></p>
    <p class="src" style="margin-top:0">일정은 비밀번호로 암호화돼서 저장돼요. 바꾸면 다른 기기에서도 새 비밀번호를 다시 넣어야 해요 (토큰 필요).</p>
    <div class="tools"><button class="btn" type="button" id="pwBtn">비밀번호 바꾸기</button><button class="btn del" type="button" id="lockNowBtn">이 기기 잠그기</button></div>
    <hr style="border:0;border-top:1px solid var(--line);margin:14px 0">
    <p><b>백업 / 복구 / 초기화</b></p>
    <textarea id="json" spellcheck="false"></textarea>
    <div class="tools">
      <button class="btn" type="button" id="copyBtn">복사</button>
      <button class="btn pri" type="button" id="loadBtn">불러오기</button>
      <button class="btn del" type="button" id="resetBtn">다시 받기</button>
      <button class="btn" value="close">닫기</button>
    </div>
  </form>
</dialog>

<script>
const KEY='travel-plan-v1';
/* 일정 데이터는 페이지에 넣지 않아요 (공개 페이지라서). 비밀번호로 잠긴 travel.json 을 받아서 풀어요 */
const DEFAULT={days:[{id:'d0',tab:'🔒',title:'🔒 잠겨 있어요',info:[],items:[],check:[],src:''}],places:[]};
const DEFAULT_PACK=[
 ['필수 서류','여권 (유효기간 6개월 이상)'],['필수 서류','호주 ETA 승인 확인 (두 사람)'],['필수 서류','뉴질랜드 NZeTA / NZTD 입국신고'],['필수 서류','항공권 · 숙소 예약 확인서'],['필수 서류','여행자보험 증권'],['필수 서류','국제운전면허증 + 한국 면허증 (렌터카 시)'],
 ['결제 · 돈','해외결제 카드 (각자 1장)'],['결제 · 돈','현금 (AUD · NZD 소액)'],
 ['전자기기','eSIM · 로밍 설정'],['전자기기','휴대폰 충전기'],['전자기기','보조배터리 (기내 휴대)'],['전자기기','멀티 어댑터 (호주·뉴질랜드 Type I)'],['전자기기','이어폰'],
 ['의류 · 생활','우산 · 우비'],['의류 · 생활','선글라스 · 선크림'],['의류 · 생활','편한 신발'],['의류 · 생활','겉옷 (일교차)'],['의류 · 생활','세면도구'],['의류 · 생활','상비약'],
 ['기타','입국카드 작성용 볼펜'],['기타','지퍼백 · 비닐봉지']
].map(([cat,text])=>({cat,text,done:false}));
/* 기존 데이터에 지도 검색어(loc)·이동수단(mode)을 채워 주는 마이그레이션 */
const LOCS={};
function guessMode(n){
  if(/SkyBus|기차|트램|버스|901/.test(n))return'transit';
  if(/우버|택시|셔틀|Transfer|직행/.test(n))return'driving';
  if(/도보/.test(n))return'walking';
  return'transit';
}
/* 장소 종류 */
const KINDS=[['sight','📸 명소','#7c3aed'],['nature','🏞 자연·산책','#15803d'],['activity','🎟 체험·전망','#0369a1'],['restaurant','🍽 식당','#c2410c'],['cafe','☕ 카페','#92400e'],['market','🛍 시장·쇼핑','#be185d'],['hotel','🏨 숙소','#475569'],['airport','✈️ 공항·비행','#1d4ed8'],['station','🚉 역·정류장','#0f766e'],['tour','🚌 투어','#a16207'],['car','🚗 렌터카','#4d7c0f'],['etc','📌 기타','#64748b']];
const KMAP=Object.fromEntries(KINDS.map(([k,l,c])=>[k,{l,c}]));
function guessKind(it){
  const n=it.name||'', s=n+' '+(it.loc||'');
  if(/렌터카/.test(n))return'car';
  if(/[A-Z]{3}\s*→\s*[A-Z]{3}|입국|출국|공항 체크인|국내선 체크인|T1 체크인|체크인 · 출국/.test(n))return'airport';
  if(/투어|픽업|코치|미팅 장소|해산/.test(n))return'tour';
  if(/카페|Caf[eé]|Bagel|Pantry/i.test(n))return'cafe';
  if(/Market(s)?\b|시장|Arcade/.test(n)&&!/저녁 고르면/.test(n))return'market';
  if(/Gondola|Onsen|Skydeck|Tower Eye|Scenic World|Zoo|크루즈|건너기/i.test(n))return'activity';
  if(/저녁|점심|브런치|야식|아침|Dinner|Lunch|Restaurant|Noodles|Burger|Dining|Grill|Kitchen|Eatery|Bar\b/i.test(n))return'restaurant';
  if(/역 도착|역\b|Station(?! Pier)|하차|정류장/.test(n))return'station';

/* 새 이동은 도보·대중교통·우버 3가지로 자동 생성. 새 장소를 넣으면 앞뒤 이동도 새로 만들어요 */
const defOpts=()=>[['도보','walking'],['대중교통','transit'],['우버','driving']].map(([name,mode])=>({name,route:'',dur:'',min:0,max:0,note:'',mode}));

function fixAround(d,k){

  else if(pv&&pv.type==='leg')resetLeg(pv);

  return k;

/* 이동 제목은 번호 대신 앞·뒤 장소 이름으로 자동 표시 */
const shortN=it=>{const c=chosen(it);return String(c?c.name:(it.name||'')).replace(/\s*[（(][^)）]*[)）]/g,'').trim()};

/* ================= 전체 요약 (시간표 + 이동 동선) ================= */
const tmins=t=>[...String(t||'').replace(/\d+\/\d+\s+/,'').matchAll(/(\d{1,2}):(\d{2})/g)].map(m=>+m[1]*60+ +m[2]);
const WDK='일월화수목금토';
/* ---- 오늘 · 지금 일정 표시 ---- */
const sameDay=(a,b)=>a&&b&&a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();
const todayIdx=()=>S.days.findIndex(d=>sameDay(dayDate(d),new Date()));
function stopRange(d,it){
  let t=String(it.time||'');const pm=/^(\d+)\/(\d+)\s+/.exec(t);
  if(pm){const dd=dayDate(d);if(dd&&(+pm[1]!==dd.getMonth()+1||+pm[2]!==dd.getDate()))return null;t=t.slice(pm[0].length)}
  const ts=[...t.matchAll(/(\d{1,2}):(\d{2})/g)].map(m=>+m[1]*60+ +m[2]);if(!ts.length)return null;
  let s=ts[0],e=ts.length>1?ts[1]:null;if(e!==null&&e<s)e+=1440;
  if(e===null){const m=durMin(it.stay);e=s+(m||0)}
  return{s,e}}
function nowState(d){
  const now=new Date(),N=now.getHours()*60+now.getMinutes();
  const st=[];d.items.forEach((it,i)=>{if(it.type!=='stop'||hidden(d,it))return;const r=stopRange(d,it);if(r)st.push({i,it,...r})});
  if(!st.length)return null;
  for(let k=0;k<st.length;k++){const a=st[k];
    if(N>=a.s&&N<Math.max(a.e,a.s+1))return{N,cur:a.i,kind:'stop',a,next:st[k+1]};
    const b=st[k+1];if(b&&N>=a.e&&N<b.s){const leg=d.items.slice(a.i+1,b.i).findIndex(x=>x.type==='leg'&&!hidden(d,x));return{N,cur:leg>=0?a.i+1+leg:a.i,kind:'move',a,next:b}}}
  if(N<st[0].s)return{N,cur:null,kind:'before',next:st[0]};
  return{N,cur:null,kind:'done'}}
const hhmm=N=>String(Math.floor(N/60)%24).padStart(2,'0')+':'+String(N%60).padStart(2,'0');
function applyNow(){
  const bar=document.getElementById('nowbar');if(!bar||view!=='day')return;
  const d=S.days[cur];document.querySelectorAll('.row.nowc,.row.past').forEach(r=>r.classList.remove('nowc','past'));
  if(!sameDay(dayDate(d),new Date())){const t=todayIdx();bar.innerHTML=t>=0?`<button class="nowb other" data-tab="${t}">📍 오늘 일정 보기 (${esc(S.days[t].tab)})</button>`:'';return}
  const x=nowState(d);if(!x){bar.innerHTML='';return}
  const nm=it=>esc(sName(it));let msg='';
  if(x.kind==='stop')msg=`<b>지금</b> ${nm(x.a.it)} <span class="sub">${hhmm(x.a.s)}~${hhmm(x.a.e)}</span>`+(x.next?`<br><span class="sub">다음 ${hhmm(x.next.s)} · ${nm(x.next.it)}</span>`:'');
  else if(x.kind==='move'){const l=d.items[x.cur],o=l&&l.type==='leg'?selOpt(l):null;msg=`<b>이동 중</b> → ${nm(x.next.it)} <span class="sub">${hhmm(x.next.s)} 도착 예정</span>`+(o?`<br><span class="sub">${esc(o.name)}${o.dur?' · '+esc(o.dur):''}</span>`:'')}
  else if(x.kind==='before')msg=`<b>오늘 첫 일정</b> ${hhmm(x.next.s)} · ${nm(x.next.it)}`;
  else msg=`<b>오늘 일정 끝</b> · 푹 쉬어요 🌙`;
  bar.innerHTML=`<button class="nowb" ${x.cur!==null?`data-gonow="${x.cur}"`:''}>🟢 <span class="sub">${hhmm(x.N)}</span> ${msg}</button>`;
  document.querySelectorAll('#app .row[data-ri]').forEach(r=>{const i=+r.dataset.ri;
    if(x.cur!==null&&i===x.cur)r.classList.add('nowc');
    else if(x.kind==='done'||(x.cur!==null&&i<x.cur))r.classList.add('past')});
}
function gotoToday(){const t=todayIdx();if(t>=0){cur=t;view='day'}return t>=0}
setInterval(()=>{if(!document.hidden&&!locked&&!editing)applyNow()},60000);
function dayDate(d){const m=/(\d+)\/(\d+)/.exec(d.tab);return m?new Date(2026,+m[1]-1,+m[2]):null}
/* 시간 칸(09:30~10:00)과 머무는 시간(30분)을 서로 연동. 한쪽을 고치면 다른 쪽이 따라 바뀜.
   '~'로 끝나는 범위나 시작 시각만 있는 경우에만 (비행 '→'·'약'이 붙은 대략 시간·범위 '30~45분'은 건드리지 않음) */
const hmMin=t=>{const m=/(\d{1,2}):(\d{2})/.exec(t);return m?+m[1]*60+ +m[2]:null};
const fmtHM=m=>String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
function stayMin(t){
  t=String(t||'');if(/[~-]/.test(t))return null;
  const h=/(\d+)\s*시간/.exec(t),m=/(\d+)\s*분/.exec(t);
  return h||m?(h?+h[1]*60:0)+(m?+m[1]:0):null;
}
const stayText=m=>m<60?`${m}분`:`${Math.floor(m/60)}시간${m%60?' '+(m%60)+'분':''}`;
function linkTimeStay(it,field,idx){
  if(!it||it.type!=='stop')return;
  const tm=/^\s*(\d{1,2}:\d{2})\s*(?:~\s*(\d{1,2}:\d{2})?)?\s*$/.exec(String(it.time||''));
  const setDom=(k,v)=>{const el=document.querySelector(`[data-p="items.${idx}.${k}"]`);if(el)el.value=v};
  if(field==='stay'){
    const m=stayMin(it.stay);
    if(tm&&m>0){it.time=tm[1]+'~'+fmtHM(hmMin(tm[1])+m);setDom('time',it.time)}
  }else if(tm&&tm[2]){
    const m=hmMin(tm[2])-hmMin(tm[1]);
    if(m>0){it.stay=stayText(m);setDom('stay',it.stay)}
  }

/* 시간 자동 이어붙이기: 앞 일정이 끝나는 시각 + 선택한 이동 시간 = 다음 일정 시작.
   이동 시간이 범위(10~15분)면 보수적으로 큰 쪽을 써요. 🔒 시간 고정·비행(→) 일정은 안 움직이고, 그 끝 시각부터 다시 이어붙여요.

function durMin(t){

  if(t.includes('~')){const[l,r]=t.split('~'),L=mm(l),R=mm(r);H=R.h!==undefined?R.h:L.h;M=R.m!==undefined?R.m:(R.h!==undefined?undefined:(/(\d+)\s*$/.exec(r.trim())||[])[1])}

  return Math.round((+H||0)*60+(+M||0));
}
/* 하루 총 이동시간: 보이는 이동 구간의 '선택한 수단' 소요시간 합 (범위면 최소~최대) */

  t=String(t||'').replace(/[（(].*?[)）]/g,'');

/* 날씨: Open-Meteo 예보 (API 키 필요 없음, 16일 앞까지). day.wx=[{n,lat,lon}] 지역, stop.wr=지역 번호 (-1 = 비행 중) */

function wxDay(d,r){const x=WX&&WX.data[wxK(r)];if(!x)return null;const i=x.d.time.indexOf(wxDate(d));if(i<0)return null;

  const m=/(\d{1,2}):(\d{2})/.exec(String(it.time||'').replace(/\d+\/\d+\s+/,''));const hr=m?Math.min(23,+m[1]+(+m[2]>=30?1:0)):12;

function cascade(d,from,all){
  const it=d.items;let cur=null,gap=0;

  for(let i=0;i<it.length;i++){

/* ---- GitHub sync: travel-data 브랜치의 travel.json ---- */
const GH={owner:'devsoominchae',repo:'devsoominchae.github.io',branch:'travel-data',path:'travel.json'};
const API=`https://api.github.com/repos/${GH.owner}/${GH.repo}/contents/${GH.path}`;
let token='';try{token=localStorage.getItem('travel-gh-token')||''}catch(e){}
let sha=null,dirty=false,pushing=false,pushTimer=null;
const setStatus=t=>{$('#syncBtn').textContent=t};
const hdr=()=>Object.assign({Accept:'application/vnd.github+json'},token?{Authorization:'Bearer '+token}:{});
const b64e=s=>btoa(unescape(encodeURIComponent(s)));
const b64d=s=>decodeURIComponent(escape(atob(s.replace(/\s/g,''))));
/* ---- 비밀번호 암호화 (AES-GCM, PBKDF2-SHA256) ---- */
const RAW=`https://raw.githubusercontent.com/${GH.owner}/${GH.repo}/${GH.branch}/${GH.path}`;
const TE=new TextEncoder(),TD=new TextDecoder();
function u8b64(u){let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)}
const b64u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function deriveKey(pw,salt,it){const base=await crypto.subtle.importKey('raw',TE.encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64u8(salt),iterations:it||250000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['encrypt','decrypt'])}
let CK=null,locked=true;
async function loadCK(){try{const o=JSON.parse(localStorage.getItem('travel-key')||'null');if(!o)return null;return{salt:o.salt,key:await crypto.subtle.importKey('raw',b64u8(o.k),'AES-GCM',true,['encrypt','decrypt'])}}catch(e){return null}}
async function saveCK(){try{localStorage.setItem('travel-key',JSON.stringify({salt:CK.salt,k:u8b64(new Uint8Array(await crypto.subtle.exportKey('raw',CK.key)))}))}catch(e){}}
async function seal(o){const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},CK.key,TE.encode(JSON.stringify(o))));
  return{v:1,enc:'AES-GCM',kdf:'PBKDF2-SHA256',it:250000,salt:CK.salt,iv:u8b64(iv),ct:u8b64(ct),updatedAt:o.updatedAt||0}}
async function unseal(w,ck){return JSON.parse(TD.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64u8(w.iv)},ck.key,b64u8(w.ct))))}
async function fetchWrap(){
  if(!token){const r=await fetch(RAW+'?t='+Date.now(),{cache:'no-store'});if(r.status===404)return{missing:true};if(!r.ok)throw new Error(r.status);return{sha:null,w:await r.json()}}
  const r=await fetch(`${API}?ref=${GH.branch}&t=${Date.now()}`,{headers:hdr(),cache:'no-store'});
  if(r.status===404)return{missing:true};
  if(!r.ok)throw new Error(r.status);
  const j=await r.json();
  return{sha:j.sha,w:JSON.parse(b64d(j.content))};
}
async function fetchRemote(){
  const x=await fetchWrap();if(x.missing)return x;
  if(!x.w.ct)return{sha:x.sha,data:x.w};                 /* 예전 평문 데이터 */
  if(!CK||CK.salt!==x.w.salt)return{sha:x.sha,locked:true};/* 비밀번호가 바뀜 */
  try{return{sha:x.sha,data:await unseal(x.w,CK)}}catch(e){return{sha:x.sha,locked:true}}
}
function lockNow(msg){locked=true;CK=null;try{localStorage.removeItem('travel-key');localStorage.removeItem(KEY)}catch(e){}
  S=migrate(clone(DEFAULT));S.updatedAt=0;dirty=false;$('#lock').hidden=false;$('#lockMsg').textContent=msg||'';render();setTimeout(()=>$('#lockpw').focus(),50)}
async function unlock(){
  const pw=$('#lockpw').value;if(!pw)return;$('#lockMsg').textContent='확인 중…';$('#lockBtn').disabled=true;
  try{
    const x=await fetchWrap();
    if(x.missing||!x.w.ct){$('#lockMsg').textContent='아직 잠긴 일정이 없어요.';return}
    const ck={salt:x.w.salt,key:await deriveKey(pw,x.w.salt,x.w.it)};
    let data;try{data=await unseal(x.w,ck)}catch(e){$('#lockMsg').textContent='비밀번호가 틀렸어요.';return}
    CK=ck;await saveCK();locked=false;$('#lock').hidden=true;$('#lockpw').value='';sha=x.sha;
    const local=load();
    if(local.days&&local.days[0]&&local.days[0].id!=='d0'&&(local.updatedAt||0)>(data.updatedAt||0)){S=migrate(local);dirty=true;schedulePush()}else adopt(data);
    cur=Math.min(cur,S.days.length-1);gotoToday();render();loadWx();
  }catch(e){$('#lockMsg').textContent='일정을 못 받아왔어요. 인터넷 연결을 확인해 주세요.'}
  finally{$('#lockBtn').disabled=false}
}
$('#lockBtn').onclick=unlock;
$('#lockpw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});
$('#lockNowBtn').onclick=()=>{if(confirm('이 기기에서 일정을 지우고 잠글까요? 다시 보려면 비밀번호가 필요해요.')){$('#dlg').close();lockNow()}};
$('#pwBtn').onclick=async()=>{
  if(!token){alert('비밀번호를 바꾸려면 먼저 GitHub 토큰을 넣어 주세요.');return}
  const a=prompt('새 비밀번호');if(!a)return;if(a.length<6){alert('6자 이상으로 해 주세요.');return}
  if(prompt('한 번 더 입력해 주세요')!==a){alert('두 번 입력한 게 달라요.');return}
  const salt=u8b64(crypto.getRandomValues(new Uint8Array(16)));CK={salt,key:await deriveKey(a,salt)};await saveCK();
  $('#dlg').close();save();toast('🔒 비밀번호를 바꿨어요. 저장되면 다른 기기는 새 비밀번호로 열어야 해요.');
};
function adopt(d){S=migrate(d);cur=Math.min(cur,S.days.length-1);persist();render()}
const typing=()=>{const a=document.activeElement;return a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)};
function schedulePush(){clearTimeout(pushTimer);setStatus(token?'☁️ …':'☁️ 기기에만');pushTimer=setTimeout(push,1500)}
async function pull(){
  if(locked||dirty||pushing)return;
  try{
    const r=await fetchRemote();
    if(r.locked){lockNow('비밀번호가 바뀌었어요. 새 비밀번호를 넣어 주세요.');return}
    if(r.missing){sha=null;if(token){dirty=true;await push()}else setStatus('☁️ 읽기전용');return}
    sha=r.sha;
    const rt=r.data.updatedAt||0,lt=S.updatedAt||0;
    if(rt>lt){if(typing())return;adopt(r.data)}
    else if(lt>rt&&token){dirty=true;await push();return}
    setStatus(token?'☁️ ✓':'☁️ 읽기전용');
  }catch(e){setStatus('☁️ ⚠️')}
}
async function push(){
  if(!dirty||locked||!CK)return;
  if(!token){setStatus('☁️ 기기에만');return}
  if(pushing)return;
  pushing=true;let again=false;
  try{
    setStatus('☁️ 저장 중');
    for(let n=0;n<3;n++){
      const snap=S.updatedAt;
      const body={message:'travel: update',branch:GH.branch,content:b64e(JSON.stringify(await seal(S)))};
      if(sha)body.sha=sha;
      const r=await fetch(API,{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},hdr()),body:JSON.stringify(body)});
      if(r.ok){const j=await r.json();sha=j.content.sha;if(S.updatedAt===snap)dirty=false;setStatus('☁️ ✓');break}
      if(r.status===409||r.status===422){
        const x=await fetchRemote();
        if(x.locked){dirty=false;lockNow('비밀번호가 바뀌었어요. 새 비밀번호를 넣어 주세요.');break}
        if(!x.missing&&(x.data.updatedAt||0)>(S.updatedAt||0)){dirty=false;adopt(x.data);sha=x.sha;setStatus('☁️ ✓');break}
        sha=x.missing?null:x.sha;continue;
      }
      throw new Error(r.status);
    }
  }catch(e){setStatus('☁️ ⚠️')}
  finally{pushing=false;again=dirty}
  if(again)schedulePush();
}
$('#tokBtn').onclick=()=>{
  token=$('#tok').value.trim();
  try{
    token?localStorage.setItem('travel-gh-token',token):localStorage.removeItem('travel-gh-token');
  }catch(e){}
  $('#dlg').close();
  sha=null;pull();
};
document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()});
addEventListener('online',pull);
setInterval(()=>{if(!document.hidden)pull()},30000);
(async()=>{
  CK=await loadCK();
  if(CK&&crypto.subtle){locked=false;gotoToday();render();pull();setTimeout(()=>loadWx(),300)}
  else lockNow();
})();
document.addEventListener('visibilitychange',()=>{if(!document.hidden)loadWx()});
setStatus(token?'☁️ …':'☁️');
pull();
</script>
</body>
